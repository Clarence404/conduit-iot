<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc">
  <title id="title">Conduit 租户内组织模型与设备归属</title>
  <desc id="desc">租户是最高安全边界。客户可关联多个项目，项目包含站点，站点包含树形资产。产品由租户共享，设备引用产品、必须归属站点并可选关联同站点资产。</desc>
  <style>
    :root { --fg:#1a1a2e; --muted:#6b7280; --bg:#f8f9fc; --card:#ffffff; --border:#e2e8f0; --p:#6366f1; --b:#0284c7; --g:#059669; --y:#d97706; --r:#dc2626; }
    :root[data-theme="dark"] { --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c; --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171; }
    @media (prefers-color-scheme: dark) { :root { --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c; --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171; } }
    text{font-family:system-ui,"Microsoft YaHei",sans-serif;fill:var(--fg)} .bg{fill:var(--bg)}
    .box{fill:var(--card);stroke:var(--border);stroke-width:1.5}.boundary{fill:none;stroke:var(--p);stroke-width:2;stroke-dasharray:7 5}
    .name{font-size:15px;font-weight:700}.sub{font-size:12px;fill:var(--muted)}.label{font-size:12px;fill:var(--b)}
    .flow{fill:none;stroke:var(--b);stroke-width:2}.optional{fill:none;stroke:var(--y);stroke-width:2;stroke-dasharray:5 4}
  </style>
  <defs>
    <marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 7 3.5 0 7Z" fill="var(--b)"/></marker>
    <marker id="optional-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 7 3.5 0 7Z" fill="var(--y)"/></marker>
  </defs>
  <rect class="bg" width="1000" height="560"/><text class="name" x="500" y="27" text-anchor="middle">Conduit · 租户内组织模型（V0.3-B1 已实现）</text>
  <rect class="boundary" x="30" y="48" width="940" height="488" rx="14"/><text class="name" x="50" y="76">租户 tenant</text><text class="sub" x="950" y="76" text-anchor="end">合同 · 计费 · 资源 · 安全边界</text>
  <rect class="box" x="70" y="104" width="250" height="64" rx="10"/><text class="name" x="195" y="131" text-anchor="middle">客户 customer</text><text class="sub" x="195" y="153" text-anchor="middle">业务归类 · 不是子租户</text>
  <rect class="box" x="375" y="104" width="250" height="64" rx="10"/><text class="name" x="500" y="131" text-anchor="middle">项目 project</text><text class="sub" x="500" y="153" text-anchor="middle">主要授权与运营范围</text>
  <rect class="box" x="680" y="104" width="250" height="64" rx="10"/><text class="name" x="805" y="131" text-anchor="middle">产品 product</text><text class="sub" x="805" y="153" text-anchor="middle">租户共享的设备模板</text>
  <rect class="box" x="375" y="204" width="250" height="64" rx="10"/><text class="name" x="500" y="231" text-anchor="middle">站点 site</text><text class="sub" x="500" y="253" text-anchor="middle">物理位置 · 必属一个项目</text>
  <rect class="box" x="375" y="304" width="250" height="64" rx="10"/><text class="name" x="500" y="331" text-anchor="middle">资产 asset</text><text class="sub" x="500" y="353" text-anchor="middle">同站点树形结构 · 最多 8 层</text>
  <rect class="box" x="375" y="404" width="250" height="72" rx="10"/><text class="name" x="500" y="433" text-anchor="middle">设备 device</text><text class="sub" x="500" y="456" text-anchor="middle">必须归属站点 · 资产可选</text>
  <line class="optional" x1="326" y1="136" x2="369" y2="136" marker-end="url(#optional-arrow)"/><text class="sub" x="347" y="122" text-anchor="middle">可选关联</text>
  <line class="flow" x1="500" y1="172" x2="500" y2="198" marker-end="url(#arrow)"/><line class="flow" x1="500" y1="272" x2="500" y2="298" marker-end="url(#arrow)"/><line class="flow" x1="500" y1="372" x2="500" y2="398" marker-end="url(#arrow)"/>
  <path class="flow" d="M805 172 V440 H631" marker-end="url(#arrow)"/><text class="label" x="817" y="286">设备引用产品</text>
  <path class="optional" d="M369 336 H335 V440 H369" marker-end="url(#optional-arrow)"/><text class="sub" x="322" y="390" text-anchor="end">可选归属</text>
  <text class="sub" x="500" y="510" text-anchor="middle">项目由设备所在站点推导；组合外键阻止跨租户、跨站点关联</text>
</svg>
