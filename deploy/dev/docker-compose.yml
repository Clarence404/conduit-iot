# 开发环境包（deploy/dev）：PostgreSQL、Redis、InfluxDB 3、InfluxDB 3 Explorer、EMQX。
# 应用（server、transport、模拟器、前端）在开发机的 IDE 中运行，EMQX 的鉴权回调打到开发机上的 server。
# 用法：把本目录放到 Linux 宿主机上，cp .env.example .env 并修改口令与 CONDUIT_AUTH_URL，然后 docker compose up -d。
# 独立部署包 deploy/standalone 用 extends 引用这里的 5 个基础服务与 metrics 监控栈：修改本文件会同时影响独立部署包，两者项目名与数据卷相同。
# 监控栈（Prometheus + Grafana 等 5 个服务）全部在 compose profile「metrics」下：不加 --profile metrics 时一个容器都不启动。
name: conduit

services:
  postgres:
    image: postgres:16.8
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-conduit}
      POSTGRES_USER: ${POSTGRES_USER:-conduit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - pg-data:/var/lib/postgresql/data
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${POSTGRES_PORT:-15432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-conduit} -d ${POSTGRES_DB:-conduit}"]
      interval: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7.4.2
    # 写命令回复前刷盘；保持重写期间也 fsync，避免已确认的总线消息只留在页缓存。
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "always", "--no-appendfsync-on-rewrite", "no"]
    volumes:
      - redis-data:/data
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${REDIS_PORT:-16379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 20
    restart: unless-stopped

  influxdb:
    image: influxdb:3.12.0-core
    # 启动时由 INFLUX_TOKEN 生成离线管理员 token 文件（只有库里还没有管理员 token 时才生效），再启动服务
    # --disable-authz 中的 metrics：让 Prometheus 免 token 抓取运行指标。InfluxDB 3 Core 只有管理员 token（能写能删整个库），
    # 为读几个运行指标把全权限凭据分发给 Prometheus 会扩大泄露面；/metrics 只暴露运行指标，泄露代价远小于管理员 token。
    # 允许的取值经实测为 health、ping、metrics、ready、pprof、node_stop（--help 里不列，用非法值探测得到）。
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        case "$${INFLUX_TOKEN}" in apiv3_*) ;; *) echo "INFLUX_TOKEN must start with apiv3_" >&2; exit 1;; esac;
        umask 077
        && printf '{"token":"%s","name":"_admin"}' "$${INFLUX_TOKEN}" > /tmp/admin-token.json
        && exec influxdb3 serve --node-id node0 --object-store file --data-dir /var/lib/influxdb3/data
        --admin-token-file /tmp/admin-token.json --disable-authz health,ping,metrics
    environment:
      INFLUX_TOKEN: ${INFLUX_TOKEN:?INFLUX_TOKEN is required}
      # 单次查询允许打开的 parquet 文件数上限（InfluxDB 3 Core 默认 432）。
      # Core 不做 compaction，时间范围内的文件全要打开，标签过滤不减少文件数，所以这个上限直接决定可查询的最大跨度。
      # parquet 文件按 --gen1-duration 切分，而它只接受 1m/5m/10m（实测，--help 只写了默认值 10m 没写取值范围），
      # 默认的 10m 已经是最大，**无法降低文件数**：144 个/天是下限。于是 432 ÷ 144 = 3 天，即默认配置下
      # 任何超过 2 天的历史查询都必然失败。要支撑接口承诺的 30 天需要 30 × 144 = 4320 个，故取 5000 留余量。
      # 不要再往上无限放大：打开数千个文件会显著抬高内存与延迟（InfluxDB 自身的报错也这么警告），
      # 真正的解法是分段查询，排在 V0.3-E。
      INFLUXDB3_QUERY_FILE_LIMIT: ${INFLUX_QUERY_FILE_LIMIT:-5000}
    # 内存上限：长范围查询的内存随扫描文件数增长，不限制时一次失控查询会拖垮整台宿主机上的其他服务
    mem_limit: ${INFLUX_MEM_LIMIT:-2g}
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${INFLUX_PORT:-8096}:8181"
    volumes:
      - influx3-data:/var/lib/influxdb3
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8181/health"]
      interval: 5s
      retries: 30
    restart: unless-stopped

  influxdb-explorer:
    # InfluxDB 3 官方图形界面（InfluxDB 3 Explorer），预置连接到本编排的 InfluxDB 与 telemetry 库。
    # admin 模式可管理库与 token；它本身没有登录，只应在可信网络中暴露（端口按 BIND_ADDR 绑定）。
    image: influxdata/influxdb3-ui:1.11.0
    environment:
      DEFAULT_SERVER_NAME: conduit
      DEFAULT_INFLUX_SERVER: http://influxdb:8181
      DEFAULT_API_TOKEN: ${INFLUX_TOKEN:?INFLUX_TOKEN is required}
      DEFAULT_INFLUX_DATABASE: telemetry
      UI_MODE: admin
      # 会话签名密钥；不设置时每次重启都会生成新密钥，已打开的页面需要重新进入
      SESSION_SECRET_KEY: ${INFLUX_EXPLORER_SESSION_KEY:?INFLUX_EXPLORER_SESSION_KEY is required}
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${INFLUX_EXPLORER_PORT:-8888}:8080"
    volumes:
      - influx-explorer-data:/db
    depends_on:
      influxdb:
        condition: service_healthy
    restart: unless-stopped

  emqx:
    # 官方镜像；Conduit 的配置模板与 ACL 从本目录 emqx/ 只读挂载（不再烘焙进自定义镜像）。
    # 启动时把模板中的鉴权回调地址与内部 token 渲染成 /opt/emqx/etc/base.hocon，再以前台方式启动 EMQX
    image: ${EMQX_IMAGE:-emqx/emqx:5.10.5}
    # 每条 MQTT 连接占一个文件描述符。Docker 默认软限制 1024，约 1,000 台设备时 EMQX 即报 emfile，
    # 内置 Mnesia 打不开日志文件而整节点崩溃，设备重连又再次打满，形成反复重启（2026-10-30 实测 900 台压测触发）
    ulimits:
      nofile:
        soft: 1048576
        hard: 1048576
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        esc() { printf '%s' "$$1" | sed 's/[&|\\]/\\&/g'; };
        sed -e "s|__CONDUIT_INTERNAL_TOKEN__|$$(esc "$${CONDUIT_INTERNAL_TOKEN}")|"
        -e "s|__CONDUIT_AUTH_URL__|$$(esc "$${CONDUIT_AUTH_URL}")|"
        /conduit/base.hocon.tpl > /opt/emqx/etc/base.hocon
        && sed -e "s|__EMQX_API_KEY__|$$(esc "$${CONDUIT_EMQX_API_KEY}")|"
        -e "s|__EMQX_API_SECRET__|$$(esc "$${CONDUIT_EMQX_API_SECRET}")|"
        /conduit/api-key.bootstrap.tpl > /opt/emqx/data/api-key.bootstrap
        && exec /usr/bin/docker-entrypoint.sh /opt/emqx/bin/emqx foreground
    environment:
      CONDUIT_INTERNAL_TOKEN: ${CONDUIT_INTERNAL_TOKEN:?CONDUIT_INTERNAL_TOKEN is required}
      # 鉴权回调地址（必填）：开发时为开发机上 server 的地址 http://<dev-host>:8080；独立部署包固定为 http://conduit-server:8080
      CONDUIT_AUTH_URL: ${CONDUIT_AUTH_URL:?CONDUIT_AUTH_URL is required}
      # transport 读取会话指标用的只读 API key（EMQX 5 的 REST API 不接受控制台账号密码），经 bootstrap 文件下发
      EMQX_API_KEY__BOOTSTRAP_FILE: /opt/emqx/data/api-key.bootstrap
      CONDUIT_EMQX_API_KEY: ${CONDUIT_EMQX_API_KEY:?CONDUIT_EMQX_API_KEY is required}
      CONDUIT_EMQX_API_SECRET: ${CONDUIT_EMQX_API_SECRET:?CONDUIT_EMQX_API_SECRET is required}
      EMQX_DASHBOARD__DEFAULT_USERNAME: ${EMQX_DASHBOARD_USERNAME:-admin}
      EMQX_DASHBOARD__DEFAULT_PASSWORD: ${EMQX_DASHBOARD_PASSWORD:?EMQX_DASHBOARD_PASSWORD is required}
      # 内存持久会话（2026-10-28）：磁盘持久会话在积压下会静默楔死且只能丢弃会话恢复，已关闭。
      # transport 离线期间的消息进内存队列 mqueue，重连后补发；EMQX 重启则不保留——
      # 端到端不丢由设备侧的消息 id + 业务回执负责，见 docs/device-integration.md。
      EMQX_DURABLE_SESSIONS__ENABLE: "false"
      # mqueue 要覆盖 transport 主备切换窗口（选主锁 TTL 15s + 抢锁 2s ≈ 17s）；
      # 溢出会丢弃并计入 mqueue_dropped，由 transport 的会话监控告警
      EMQX_MQTT__MAX_MQUEUE_LEN: ${EMQX_MAX_MQUEUE_LEN:-100000}
      # 在途窗口：EMQX 最多允许多少条已投递未确认的消息。transport 的待提交批就被它硬限，
      # 规则是 conduit.transport.mqtt.batch-size <= 本值，且本值应为批的若干倍：相等时是停等协议
      # （发 N 条、等全部确认、再发 N 条），窗口远大于批才能流水线化。实测 1024/64 约 4000 条/秒，32/32 约 2600。
      # 在途窗口。必须显著小于 force_shutdown.max_mailbox_size（默认 1000）：
      # 在途消息堆在连接进程的 Erlang 信箱里，越过该上限会触发 mailbox_overflow 强杀
      # （2026-10-28 实测：配 1024 时负载下必然被杀，且先于队列溢出与堆超限发生）
      EMQX_MQTT__MAX_INFLIGHT: ${EMQX_MAX_INFLIGHT:-512}
      # transport 多连接共享订阅的分发策略：同一设备（发布方 clientid）的消息固定投给同一条订阅连接，
      # 保住单设备内的顺序。下游其实不依赖顺序（最新值按 ts 比较、InfluxDB 幂等、在线状态有 since 守护），
      # 但保序几乎没有成本。默认 round_robin 会把同一设备的相邻消息拆到不同连接上。
      # 注意键在 mqtt 下而不是 broker 下（EMQX 5.10 实测 `emqx ctl conf show mqtt`）；写成 EMQX_BROKER__... 会被静默忽略。
      EMQX_MQTT__SHARED_SUBSCRIPTION_STRATEGY: hash_clientid
      EMQX_CLUSTER__DISCOVERY_STRATEGY: singleton
      # 固定节点名：默认按容器 IP 命名，IP 变化会换数据目录
      EMQX_NODE__NAME: emqx@127.0.0.1
      # 单连接进程堆上限（实际按 1.5 倍触发，即 384MB）。mqueue 驻留在会话进程堆内，
      # 与本项共享同一上限：调大 MAX_MQUEUE_LEN 前必须确认 heap_size 余量，不得反过来上调本项
      EMQX_FORCE_SHUTDOWN__MAX_HEAP_SIZE: ${EMQX_CONNECTION_MAX_HEAP_SIZE:-256MB}
    volumes:
      - emqx-data:/opt/emqx/data
      # 相对路径按本文件所在目录解析（独立部署包 extends 时同样指向这里）；文件需对容器内 emqx 用户（uid 1000）可读
      - ./emqx/base.hocon.tpl:/conduit/base.hocon.tpl:ro
      - ./emqx/api-key.bootstrap.tpl:/conduit/api-key.bootstrap.tpl:ro
      - ./emqx/acl.conf:/opt/emqx/etc/conduit-acl.conf:ro
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${MQTT_PORT:-1883}:1883"
      - "${BIND_ADDR:-127.0.0.1}:${EMQX_DASHBOARD_PORT:-18083}:18083"
    # 不依赖 conduit-server：server 未运行或未就绪时，EMQX 对鉴权回调自行重试
    healthcheck:
      test: ["CMD", "/opt/emqx/bin/emqx", "ctl", "status"]
      interval: 5s
      retries: 30
    restart: unless-stopped

  # ───────────── 性能观测栈（profile: metrics，默认不启动）─────────────
  # 启用：docker compose --profile metrics up -d；停用：docker compose --profile metrics stop <服务> 或 down。
  # 全部设 mem_limit：压测机可用内存很紧，监控栈只在需要观测时才开，且不得失控吃内存。

  prometheus:
    profiles: ["metrics"]
    image: prom/prometheus:v3.5.0
    # 抓取配置里含 EMQX API key，所以像 emqx 一样启动时由模板渲染到容器内 /tmp，不把凭据写进挂载的文件
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        esc() { printf '%s' "$$1" | sed 's/[&|\\]/\\&/g'; };
        sed -e "s|__EMQX_API_KEY__|$$(esc "$${CONDUIT_EMQX_API_KEY}")|"
        -e "s|__EMQX_API_SECRET__|$$(esc "$${CONDUIT_EMQX_API_SECRET}")|"
        -e "s|__CONDUIT_INTERNAL_TOKEN__|$$(esc "$${CONDUIT_INTERNAL_TOKEN}")|"
        -e "s|__EMQX_METRICS_TARGET__|$$(esc "$${EMQX_METRICS_TARGET}")|"
        /conduit/prometheus.yml.tpl > /tmp/prometheus.yml
        && exec /bin/prometheus --config.file=/tmp/prometheus.yml --storage.tsdb.path=/prometheus
        --storage.tsdb.retention.time=$${PROMETHEUS_RETENTION} --storage.tsdb.retention.size=$${PROMETHEUS_RETENTION_SIZE}
    environment:
      CONDUIT_EMQX_API_KEY: ${CONDUIT_EMQX_API_KEY:-}
      CONDUIT_EMQX_API_SECRET: ${CONDUIT_EMQX_API_SECRET:-}
      # 抓取 conduit-server 的 /internal/metrics 用，与 EMQX 鉴权回调同一个内部令牌
      CONDUIT_INTERNAL_TOKEN: ${CONDUIT_INTERNAL_TOKEN:-}
      # EMQX 指标地址（host:port）。拆分部署时 EMQX 在另一台主机，见 deploy/split
      EMQX_METRICS_TARGET: ${EMQX_METRICS_TARGET:-emqx:18083}
      # 保留期与磁盘上限取先到者：压测机磁盘只有 16 GB
      PROMETHEUS_RETENTION: ${PROMETHEUS_RETENTION:-7d}
      PROMETHEUS_RETENTION_SIZE: ${PROMETHEUS_RETENTION_SIZE:-2GB}
    mem_limit: ${PROMETHEUS_MEM_LIMIT:-512m}
    volumes:
      - prometheus-data:/prometheus
      - ./prometheus/prometheus.yml.tpl:/conduit/prometheus.yml.tpl:ro
    # Prometheus 没有登录页：默认只绑本机，不跟随 BIND_ADDR；看面板走 Grafana
    ports:
      - "${PROMETHEUS_BIND_ADDR:-127.0.0.1}:${PROMETHEUS_PORT:-9090}:9090"
    restart: unless-stopped

  grafana:
    profiles: ["metrics"]
    image: grafana/grafana:11.6.1
    # 口令为空时拒绝启动：Grafana 空口令会回落到默认口令 admin，而端口可能对内网开放
    entrypoint: ["/bin/sh", "-c", '[ -n "$$GF_SECURITY_ADMIN_PASSWORD" ] || { echo "GRAFANA_ADMIN_PASSWORD 未设置，拒绝以默认口令启动" >&2; exit 1; }; exec /run.sh']
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      # 不用 :? 必填检查：compose 会对未启用 profile 的服务也做插值，必填会让没开监控栈的人也起不来。
      # 改由上面的 entrypoint 在容器启动时检查，留空则启动失败
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    mem_limit: ${GRAFANA_MEM_LIMIT:-256m}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${GRAFANA_PORT:-3000}:3000"
    depends_on:
      - prometheus
    restart: unless-stopped

  node-exporter:
    # 宿主机 CPU / 内存 / 磁盘 I/O。只在 compose 网络内被抓取，不对外开端口
    profiles: ["metrics"]
    image: prom/node-exporter:v1.9.1
    command: ["--path.rootfs=/host", "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"]
    pid: host
    mem_limit: ${NODE_EXPORTER_MEM_LIMIT:-64m}
    volumes:
      - /:/host:ro,rslave
    restart: unless-stopped

  cadvisor:
    # 每容器 CPU / 内存。需要只读挂载宿主机的 cgroup 与 docker 目录。
    # 单独放在 metrics-cadvisor profile 下：镜像托管在 gcr.io，部分网络环境不可达
    # （压测机实测 connection refused），而 profile 内任一镜像拉取失败会让整组都起不来。
    # 能访问 gcr.io 时用 --profile metrics --profile metrics-cadvisor 一并启动；
    # 不能访问时只用 --profile metrics，代价是没有非 JVM 容器（EMQX/Redis/PG/InfluxDB）的
    # CPU 与内存曲线，宿主机级指标仍由 node-exporter 提供。
    profiles: ["metrics-cadvisor"]
    image: gcr.io/cadvisor/cadvisor:v0.52.1
    command: ["--docker_only=true", "--housekeeping_interval=15s", "--store_container_labels=false",
              "--whitelisted_container_labels=com.docker.compose.service"]
    mem_limit: ${CADVISOR_MEM_LIMIT:-192m}
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    devices:
      - /dev/kmsg
    restart: unless-stopped

  redis-exporter:
    # Redis ops、AOF、内存，以及上行流与死信流的长度 / 消费组积压
    profiles: ["metrics"]
    image: oliver006/redis_exporter:v1.74.0
    command:
      - --redis.addr=redis://redis:6379
      - --check-single-streams=conduit:stream:up,conduit:stream:dead
    mem_limit: ${REDIS_EXPORTER_MEM_LIMIT:-64m}
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pg-data:
  redis-data:
  influx3-data:
  influx-explorer-data:
  emqx-data:
  prometheus-data:
  grafana-data:
