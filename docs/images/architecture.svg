<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 714" role="img" aria-labelledby="title desc">
  <title id="title">Conduit 当前系统架构</title>
  <desc id="desc">设备通过 MQTT 接入 EMQX。EMQX 同步调用 server 的鉴权回调。单活多备的 transport 将消息写入 Redis Streams，server 消费组异步拉取，经解码和物模型校验后写入存储。Vue 前端调用同一 server 进程的 REST 接口。server 访问 PostgreSQL、InfluxDB 3 和 Redis，并通过可替换通知接口向 Mailpit 或正式 SMTP 服务发送邀请。PostgreSQL 保存租户组织、邀请与会话。图中存储连线为进程级访问关系。</desc>
  <style>
    :root {
      --fg:#1a1a2e; --muted:#6b7280; --bg:#f8f9fc; --card:#ffffff; --border:#e2e8f0;
      --p:#6366f1; --b:#0284c7; --g:#059669; --y:#d97706; --r:#dc2626;
    }
    :root[data-theme="dark"] {
      --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
      --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
        --p:#818cf8; --b:#38bdf8; --g:#34d399; --y:#fbbf24; --r:#f87171;
      }
    }
    text{font-family:system-ui,"Microsoft YaHei",sans-serif;fill:var(--fg)}
    .bg{fill:var(--bg)} .box{fill:var(--card);stroke:var(--border);stroke-width:1.5}
    .group{fill:var(--card);stroke:var(--p);stroke-width:1.5;stroke-dasharray:6 4}
    .title{font-size:14px;font-weight:700} .name{font-size:15px;font-weight:600}
    .sub{font-size:12px;fill:var(--muted)} .label{font-size:12px;fill:var(--b)}
    .flow{fill:none;stroke:var(--b);stroke-width:2;stroke-linejoin:round}
    .control{fill:none;stroke:var(--p);stroke-width:2;stroke-dasharray:6 4;stroke-linejoin:round}
    .control-label{font-size:12px;fill:var(--p)}
  </style>
  <defs>
    <marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 7 3.5 0 7Z" fill="var(--b)"/></marker>
    <marker id="control-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 7 3.5 0 7Z" fill="var(--p)"/></marker>
  </defs>
  <rect class="bg" width="1080" height="714"/>
  <text class="title" x="540" y="34" text-anchor="middle">Conduit · 当前已实现架构</text>

  <rect class="box" x="40" y="70" width="260" height="68" rx="10"/>
  <text class="name" x="170" y="98" text-anchor="middle">设备 / 模拟器</text>
  <text class="sub" x="170" y="120" text-anchor="middle">MQTT 上报 · 支持业务回执</text>
  <rect class="box" x="780" y="70" width="260" height="68" rx="10"/>
  <text class="name" x="910" y="98" text-anchor="middle">Vue 前端（nginx）</text>
  <text class="sub" x="910" y="120" text-anchor="middle">组织、产品、设备、租户与历史曲线</text>
  <rect class="box" x="400" y="70" width="280" height="68" rx="10"/>
  <text class="name" x="540" y="98" text-anchor="middle">邮件通知通道</text>
  <text class="sub" x="540" y="120" text-anchor="middle">演示 Mailpit / 可替换 SMTP</text>

  <rect class="box" x="40" y="190" width="260" height="68" rx="10"/>
  <text class="name" x="170" y="218" text-anchor="middle">EMQX</text>
  <text class="sub" x="170" y="240" text-anchor="middle">MQTT 接入 · 磁盘持久会话</text>
  <rect class="box" x="40" y="310" width="260" height="68" rx="10"/>
  <text class="name" x="170" y="338" text-anchor="middle">conduit-transport × 2</text>
  <text class="sub" x="170" y="360" text-anchor="middle">Redis 选主 · 单活多备</text>
  <rect class="box" x="40" y="430" width="260" height="68" rx="10"/>
  <text class="name" x="170" y="458" text-anchor="middle">Redis Streams</text>
  <text class="sub" x="170" y="480" text-anchor="middle">消费组 · 待确认认领 · 死信</text>

  <rect class="group" x="400" y="190" width="640" height="340" rx="12"/>
  <text class="name" x="420" y="220">conduit-server</text>
  <text class="sub" x="1030" y="220" text-anchor="end">同一进程 · 两类入口</text>
  <rect class="box" x="430" y="250" width="250" height="70" rx="10"/>
  <text class="name" x="555" y="278" text-anchor="middle">① 同步鉴权回调</text>
  <text class="sub" x="555" y="301" text-anchor="middle">/internal/mqtt/auth</text>
  <rect class="box" x="750" y="250" width="260" height="70" rx="10"/>
  <text class="name" x="880" y="278" text-anchor="middle">REST 接口</text>
  <text class="sub" x="880" y="301" text-anchor="middle">鉴权 · 租户管理 · 业务查询</text>
  <text class="sub" x="720" y="369" text-anchor="middle">同步控制入口与异步数据处理共享业务服务和存储</text>
  <rect class="box" x="430" y="430" width="580" height="70" rx="10"/>
  <text class="name" x="720" y="458" text-anchor="middle">② 异步数据流水线</text>
  <text class="sub" x="720" y="481" text-anchor="middle">解码 → 物模型校验 → 写时序 / 最新值 → 确认消费</text>

  <line class="flow" x1="170" y1="142" x2="170" y2="184" marker-end="url(#arrow)"/>
  <text class="label" x="184" y="166">MQTT</text>
  <line class="flow" x1="170" y1="262" x2="170" y2="304" marker-end="url(#arrow)"/>
  <text class="label" x="184" y="286">持久会话订阅</text>
  <line class="flow" x1="170" y1="382" x2="170" y2="424" marker-end="url(#arrow)"/>
  <text class="label" x="184" y="406">XADD 写入</text>
  <path class="control" d="M304 224 H360 V285 H424" marker-end="url(#control-arrow)"/>
  <text class="control-label" x="314" y="207">连接时鉴权</text>
  <path class="control" d="M910 142 V208 H880 V244" marker-end="url(#control-arrow)"/>
  <text class="control-label" x="924" y="170">/api</text>
  <path class="control" d="M640 186 V160 H540 V144" marker-end="url(#control-arrow)"/>
  <line class="flow" x1="304" y1="465" x2="424" y2="465" marker-end="url(#arrow)"/>
  <text class="label" x="364" y="450" text-anchor="middle">消费组拉取</text>

  <path class="flow" d="M720 534 V570 H190 V604" marker-end="url(#arrow)"/>
  <path class="flow" d="M720 570 H540 V604" marker-end="url(#arrow)"/>
  <path class="flow" d="M720 570 H890 V604" marker-end="url(#arrow)"/>
  <text class="label" x="732" y="555">server 进程的数据访问</text>
  <rect class="box" x="40" y="610" width="300" height="80" rx="10"/>
  <text class="name" x="190" y="640" text-anchor="middle">PostgreSQL</text>
  <text class="sub" x="190" y="665" text-anchor="middle">租户 · 组织 · 设备 · 邀请 · 会话</text>
  <rect class="box" x="390" y="610" width="300" height="80" rx="10"/>
  <text class="name" x="540" y="640" text-anchor="middle">InfluxDB 3</text>
  <text class="sub" x="540" y="665" text-anchor="middle">遥测写入 · 历史查询与聚合</text>
  <rect class="box" x="740" y="610" width="300" height="80" rx="10"/>
  <text class="name" x="890" y="640" text-anchor="middle">Redis</text>
  <text class="sub" x="890" y="665" text-anchor="middle">最新值 · 在线状态 · 身份缓存 / 选主锁</text>
</svg>
