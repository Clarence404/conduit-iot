server:
  port: 8081

spring:
  application:
    name: conduit-transport
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # 身份租约续期依赖 Redis 及时返回：命令超时短于续期间隔，Redis 卡住时按续期失败处理（立即断开对应身份的 MQTT 连接）
      timeout: 2s

conduit:
  transport:
    mqtt:
      host: ${EMQX_HOST:localhost}
      # 只供 transport 使用的内部监听器（EMQX tcp:internal，zone transport 信箱与队列放宽）；1883 是设备监听器
      port: ${EMQX_PORT:1884}
      # 身份 0 的 clientId，身份 i 为 client-id-i。所有 transport 实例共用同一组：EMQX 按 clientId 为离线的订阅端排队，
      # 接手某个身份的实例接管它的会话。必须保留 conduit- 前缀（transport 超级用户鉴权依赖它）
      client-id: ${TRANSPORT_CLIENT_ID:conduit-transport}
      # 初始身份池大小 K 的旧名（兼容别名），必须与 allocation.initial-pool-size 相等，启动时校验；两者取自同一配置，
      # 改 K 请用环境变量 TRANSPORT_POOL_SIZE（旧变量 TRANSPORT_MQTT_CONNECTIONS 仍可用）。本项只决定是否共享订阅：
      # EMQX 把全平台上行都投递给同一个订阅连接进程，而一个 Erlang 进程单核封顶（2026-10-29 recon 实测），
      # 多于 1 个身份时改用共享订阅 $share/{shared-group}/...，把投递分散到 K 个连接进程。
      # 设为 1 即只有一个身份、普通订阅，谁抢到谁干活，等价于单活（回退开关）
      connections: ${TRANSPORT_POOL_SIZE:${TRANSPORT_MQTT_CONNECTIONS:64}}
      shared-group: conduit-transport
      # 与 EMQX 持久会话消息保留期（durable_sessions.message_retention_period，默认 1 天）一致
      session-expiry-seconds: 86400
      # 微批写入总线：单线程投递下，每条一次 XADD 的持续上限实测约 1230 条/秒，
      # 低于接入速率时 EMQX 的 mqueue 会溢出丢弃。攒批把每条一次往返变为每批一次。
      # 本实例所有连接的消息进入同一个合批提交器（SharedBatcher）一起写总线，各连接的在途数仍各受自己的窗口限制。
      # batch-delay 是 PUBACK 的最坏额外延迟；batch-size 设为 1 即退回逐条提交。
      # 规则：batch-size <= EMQX 的 mqtt.max_inflight（编排中的 EMQX_MAX_INFLIGHT），且窗口应为批的若干倍。
      # 待提交条目数就是 EMQX 侧未确认的在途数，被该窗口硬限：批大于窗口则永远攒不满、每批白等满 batch-delay；
      # 批等于窗口则是停等协议（发 N 条、等全部确认、再发 N 条），流水线深度为 1；窗口远大于批时
      # 提交当前批的同时下一批已在途。实测 1024/64 约 4000 条/秒，32/32 约 2600 条/秒。
      batch-size: ${TRANSPORT_BUS_BATCH_SIZE:64}
      batch-delay: ${TRANSPORT_BUS_BATCH_DELAY:5ms}
      username: ${TRANSPORT_MQTT_USERNAME:}
      password: ${TRANSPORT_MQTT_PASSWORD:}
    # 身份池多活：K 个 MQTT 身份经 Redis 租约（conduit:transport:id:{i}）分摊到存活实例（conduit:transport:members），
    # 每个实例持有 ceil(K/N) 个身份，只为持有的身份连接 EMQX。K 存在 Redis 键 conduit:transport:pool-size，只增不减。
    allocation:
      # 初始 K：Redis 中尚无 pool-size 时写入。跟随 mqtt.connections（旧键或 TRANSPORT_POOL_SIZE），两者必须相等
      initial-pool-size: ${conduit.transport.mqtt.connections}
      # 实例崩溃后最长经过 lease-ttl 其身份才能被他人接管；续期间隔必须短于它
      lease-ttl: 15s
      renew-interval: 5s
      # 分配检查（心跳、抢占、让出、重连）的间隔
      tick-interval: 2s
      # 超过 member-ttl 未心跳的实例不再计入存活实例数 N
      member-ttl: 15s
      # N 稳定这么久后才让出多余的身份，避免成员抖动时来回迁移
      rebalance-stable: 10s
      # 存活实例数超过 K × 该比例时告警，提示调大 K
      pool-alert-ratio: 0.5

    # 经 EMQX REST API 观察自己的会话：丢弃、队列水位、会话进程内存与投递停滞。
    # 2026-10-28 定位的楔死故障中所有既有信号都是绿的，这里是唯一能发现它的地方。
    monitor:
      enabled: ${TRANSPORT_MONITOR_ENABLED:true}
      base-url: ${CONDUIT_TRANSPORT_MONITOR_BASE_URL:http://localhost:18083}
      # EMQX 5 的 REST API 只认 API key/secret，不接受控制台账号密码
      api-key: ${CONDUIT_TRANSPORT_MONITOR_API_KEY:}
      api-secret: ${CONDUIT_TRANSPORT_MONITOR_API_SECRET:}
      interval: 30s
      # 连续 6 次采样都「投递受阻且投递总数不变」才判定停滞（至少 2）。N 次采样之间只有 N-1 个间隔，
      # 所以从首次异常采样到 DOWN 是 5×30s=150 秒（约 2.5 分钟），算上采样相位，自故障真正开始起最长约 3 分钟
      stall-samples: 6
      # 须与 EMQX 的 EMQX_CONNECTION_MAX_HEAP_SIZE 一致：独立部署编排把本项与它接到同一个 .env 变量上，天然一致
      heap-limit: ${CONDUIT_TRANSPORT_MONITOR_HEAP_LIMIT:256MB}
      # 单个会话队列积压达到多少条即告警（0 关闭）。不依赖 EMQX 队列上限：队列不限长时也能发现积压
      mqueue-warn-len: ${CONDUIT_TRANSPORT_MONITOR_MQUEUE_WARN_LEN:50000}
      # EMQX 主机内存已用占比达到多少即告警。只告警，不影响健康检查
      node-memory-warn-ratio: ${CONDUIT_TRANSPORT_MONITOR_NODE_MEMORY_WARN_RATIO:0.8}

management:
  endpoint:
    health:
      # components.allocation.details 显示 instanceId / held / members / poolSize / connected
      show-details: always
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus

# 日志写入文件：目录由 CONDUIT_LOG_DIR 指定（默认工作目录下 logs），按天 + 按大小滚动，控制台输出保持不变
logging:
  file:
    name: ${CONDUIT_LOG_DIR:logs}/${spring.application.name}.log
  logback:
    rollingpolicy:
      max-file-size: 50MB
      max-history: 14
      total-size-cap: 1GB
      file-name-pattern: ${CONDUIT_LOG_DIR:logs}/${spring.application.name}.%d{yyyy-MM-dd}.%i.log.gz
