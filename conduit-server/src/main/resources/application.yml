server:
  port: 8080
  tomcat:
    # EMQX 的鉴权回调走 8 条 HTTP 长连接（pool_size 8、每条最多 100 个流水线请求），空闲时 EMQX 不主动关闭。
    # Tomcat 默认空闲约 20 秒或同一连接满 100 个请求即关闭连接；EMQX 恰好在关闭瞬间复用这条连接时，请求发不出去，
    # EMQX 不重试、直接判设备未授权（2026-10-30 压测实测：http_connector_do_request_failed, reason: closing）。
    # 故放长空闲时限、取消单连接请求数上限，让连接只由 EMQX 一侧决定何时断开。
    keep-alive-timeout: 30m
    max-keep-alive-requests: -1

spring:
  application:
    name: conduit-server
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:conduit}
    username: ${POSTGRES_USER:conduit}
    password: ${POSTGRES_PASSWORD:conduit}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  mvc:
    problemdetails:
      enabled: true
  mail:
    properties:
      mail:
        smtp:
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    arg-name-based-constructor-auto-mapping: true
  global-config:
    banner: false

conduit:
  bootstrap:
    admin-username: ${CONDUIT_ADMIN_USERNAME:admin}
    admin-password: ${CONDUIT_ADMIN_PASSWORD:}
    # 平台管理员：库中没有任何平台管理员时按此创建；密码为空则不创建（只打 WARN）
    platform-admin-username: ${CONDUIT_PLATFORM_ADMIN_USERNAME:sysadmin}
    platform-admin-password: ${CONDUIT_PLATFORM_ADMIN_PASSWORD:}
  auth:
    jwt-secret: ${CONDUIT_JWT_SECRET:}
    access-ttl: 15m
    refresh-ttl: 7d
    cookie-secure: false
  internal:
    token: ${CONDUIT_INTERNAL_TOKEN:}
    transport-username: ${TRANSPORT_MQTT_USERNAME:conduit-transport}
    transport-password: ${TRANSPORT_MQTT_PASSWORD:}
  influx:
    url: ${INFLUX_URL:http://localhost:8181}
    token: ${INFLUX_TOKEN:}
    database: ${INFLUX_DATABASE:telemetry}
    retention: 30d
    # 单次写入请求的行协议字节上限，必须小于 InfluxDB 的 max_http_request_size（默认 10 MiB），
    # 超过会返回 413，而重发同样的载荷永远不会成功。默认 8 MiB 留余量
    max-request-bytes: 8388608
  pipeline:
    enabled: true
    group: conduit-server
    consumer: ${PIPELINE_CONSUMER:server-${random.uuid}}
    # 每批读取的最大消息数，默认 20000；-1 仍合法，表示不限（取走当前可读的全部）。
    # 吞吐上限约为「批大小 ÷ 1 秒」，因为每批只写一次 InfluxDB，而写入要等 WAL 刷盘（默认 1 秒）：
    # 20000 的理论上限是 2 万条/秒，远高于实测约 4000 条/秒的排空能力，既保住吞吐又封住内存。
    # 不用 -1 的原因：它一次取走流中当前可读的全部消息，而流 MAXLEN 为 100 万条，
    # 配合容器无内存上限曾导致宿主机满 swap。写入按 conduit.influx.max-request-bytes 自动拆分请求，不会 413。
    batch-size: 20000
    block: 1s
    claim-min-idle: ${PIPELINE_CLAIM_MIN_IDLE:60s}
    claim-interval: 10s
    max-deliveries: 5

management:
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus

# 日志写入文件：目录由 CONDUIT_LOG_DIR 指定（默认工作目录下 logs），按天 + 按大小滚动，控制台输出保持不变
logging:
  file:
    name: ${CONDUIT_LOG_DIR:logs}/${spring.application.name}.log
  logback:
    rollingpolicy:
      max-file-size: 50MB
      max-history: 14
      total-size-cap: 1GB
      file-name-pattern: ${CONDUIT_LOG_DIR:logs}/${spring.application.name}.%d{yyyy-MM-dd}.%i.log.gz
