conduit:
  notification:
    public-url: http://localhost:8090
  bootstrap:
    admin-username: admin
    admin-password: admin-pass-123
    platform-admin-username: sysadmin
    platform-admin-password: sysadmin-pass-123
  auth:
    jwt-secret: test-jwt-secret-test-jwt-secret-0123456789
    # Existing API tests mint JWTs directly; production defaults to rejecting tokens without sid.
    allow-legacy-sessions: true
  internal:
    token: test-internal-token
    transport-username: conduit-transport
    transport-password: transport-pass
  pipeline:
    enabled: false
    consumer: test-consumer
    claim-min-idle: 0s
  bus:
    stream-key: test:up
    dead-key: test:dead
logging:
  # 测试日志写到 target，不污染工作目录
  file:
    name: target/test-logs/${spring.application.name}.log
  logback:
    rollingpolicy:
      file-name-pattern: target/test-logs/${spring.application.name}.%d{yyyy-MM-dd}.%i.log.gz
